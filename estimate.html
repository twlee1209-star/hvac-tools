<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간이 현장 견적 툴 - HVAC Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <nav class="bg-white border-b border-slate-200 py-4 px-6"><a href="index.html" class="text-blue-600 font-semibold">&larr; 메인으로 돌아가기</a></nav>
    <main class="max-w-4xl mx-auto px-4 py-10 flex-grow w-full">
        <h1 class="text-2xl font-bold mb-6">HVAC 장비 및 시공 간이 견적 산출</h1>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">작업 규모 (공수 또는 포인트 수)</label>
                <input type="number" id="points" class="w-full border border-slate-300 rounded-lg p-2" value="5">
            </div>
            <button onclick="calcEst()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">견적 산출</button>
            <div id="estResult" class="mt-4 p-4 bg-slate-100 rounded-lg font-medium text-slate-700">결과가 여기에 표시됩니다.</div>
        </div>
        <article class="mt-8 prose text-slate-600 text-sm space-y-2">
            <h3 class="text-lg font-semibold text-slate-800">현장 시공 견적 유의사항</h3>
            <p>본 간이 견적은 현장 환경(고소 작업 여부, 자재 양중 조건, 야간 작업 등)에 따라 변동될 수 있습니다. 휴대용 무선 드릴 호이스트 및 화염 프리 인덕션 브레이징 머신 등의 전용 장비를 활용할 경우 화기 감시원 비용 및 인양 공수 절감 효과를 기대할 수 있습니다.</p>
        </article>
    </main>
    <script>
        function calcEst() {
            const pts = document.getElementById('points').value;
            const cost = pts * 150000;
            document.getElementById('estResult').innerText = `예상 산출 금액: ₩${cost.toLocaleString()} 원 (부가가치세 별도)`;
        }
    </script>
</body>
</html>
