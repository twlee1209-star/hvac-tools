<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉방 능력 계산기 - HVAC Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <nav class="bg-white border-b border-slate-200 py-4 px-6"><a href="index.html" class="text-blue-600 font-semibold">&larr; 메인으로 돌아가기</a></nav>
    <main class="max-w-4xl mx-auto px-4 py-10 flex-grow w-full">
        <h1 class="text-2xl font-bold mb-6">공간별 필요 냉방 능력 계산기</h1>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">공간 면적 (평)</label>
                <input type="number" id="pyeong" class="w-full border border-slate-300 rounded-lg p-2" value="20">
            </div>
            <button onclick="calcCooling()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">냉방 능력 산출</button>
            <div id="coolResult" class="mt-4 p-4 bg-slate-100 rounded-lg font-medium text-slate-700">결과가 여기에 표시됩니다.</div>
        </div>
        <article class="mt-8 prose text-slate-600 text-sm space-y-2">
            <h3 class="text-lg font-semibold text-slate-800">냉동공조 부하 산정 개요</h3>
            <p>상업용 및 주거용 공간의 냉방 부하는 면적뿐만 아니라 재실 인원, 외벽 부하, 전자기기 발열량에 따라 달라집니다. 본 간이 계산기는 일반적인 평당 기준 지수를 토대로 산출되며, 정밀 부하는 별도의 외피 열취득 계산을 동반해야 합니다.</p>
        </article>
    </main>
    <script>
        function calcCooling() {
            const pyeong = document.getElementById('pyeong').value;
            const kcal = pyeong * 400; // 평당 약 400 kcal/h 기준
            const rt = kcal / 3320;
            document.getElementById('coolResult').innerText = `필요 냉방 능력: ${kcal.toLocaleString()} kcal/h (약 ${rt.toFixed(1)} RT)`;
        }
    </script>
</body>
</html>
