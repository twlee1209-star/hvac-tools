<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스팀 코일 계산기 - HVAC Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <nav class="bg-white border-b border-slate-200 py-4 px-6"><a href="index.html" class="text-blue-600 font-semibold">&larr; 메인으로 돌아가기</a></nav>
    <main class="max-w-4xl mx-auto px-4 py-10 flex-grow w-full">
        <h1 class="text-2xl font-bold mb-6">스팀 코일 열량 및 유량 계산기</h1>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">풍량 (CMH)</label>
                <input type="number" id="cmh" class="w-full border border-slate-300 rounded-lg p-2" value="5000">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">공기 온도차 (입구/출구 ΔT, ℃)</label>
                <input type="number" id="deltaT" class="w-full border border-slate-300 rounded-lg p-2" value="25">
            </div>
            <button onclick="calculate()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">계산하기</button>
            <div id="result" class="mt-4 p-4 bg-slate-100 rounded-lg font-medium text-slate-700">결과가 여기에 표시됩니다.</div>
        </div>
        <article class="mt-8 prose text-slate-600 text-sm space-y-2">
            <h3 class="text-lg font-semibold text-slate-800">스팀 코일 배관 설계 실무 가이드</h3>
            <p>공조기(AHU) 내부 스팀 코일 공급 및 환수(Supply & Return) 구성 시 트랩 설치와 릴리프 댐퍼 연동은 수격 현상(Water Hammer)을 방지하는 핵심 요소입니다. 본 계산기는 현장 설계 시 개략적인 소요 열량을 산출하기 위해 활용됩니다.</p>
        </article>
    </main>
    <script>
        function calculate() {
            const cmh = document.getElementById('cmh').value;
            const dt = document.getElementById('deltaT').value;
            const kcal = cmh * 1.2 * 0.24 * dt / 60;
            document.getElementById('result').innerText = `예상 소요 열량: ${kcal.toFixed(2)} kcal/h`;
        }
    </script>
</body>
</html>
